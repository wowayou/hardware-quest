name: Deploy to GitHub Pages

# 仓库还是私有的，免费套餐下私有仓库不能用 GitHub Pages，所以先只允许手动触发。
# 公开仓库并在 Settings → Pages 里把 Source 设成 GitHub Actions 之后，
# 把下面注释掉的 push 触发加回来，就恢复成"推送到 main 自动发布"。
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
